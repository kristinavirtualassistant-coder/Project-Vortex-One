name: Vortex One CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vortex_one_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vortex_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check server/src/index.js
      - run: node --check server/src/routes/property.js
      - run: node --check server/src/routes/owners.js
      - run: node --check server/src/services/propertyIntelligence.js
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_one_test
      - run: npm run test:m1
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_one_test
          JWT_SECRET: m1-ci-secret
