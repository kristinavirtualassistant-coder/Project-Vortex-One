services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vortex_one}
      POSTGRES_USER: ${POSTGRES_USER:-vortex_one}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - vortex_one_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vortex_one}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vortex_one}
      DEFAULT_CALLER_ID: ${DEFAULT_CALLER_ID:-}
      RC_SERVER_URL: ${RC_SERVER_URL:-https://platform.ringcentral.com}
      RC_APP_CLIENT_ID: ${RC_APP_CLIENT_ID:-}
      RC_APP_CLIENT_SECRET: ${RC_APP_CLIENT_SECRET:-}
      RC_USER_JWT: ${RC_USER_JWT:-}
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  vortex_one_pgdata:
