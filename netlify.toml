[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

# Vortex One is a client-side React application. This fallback keeps
# direct navigation to application routes from returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
