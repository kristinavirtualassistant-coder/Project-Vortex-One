name: Vortex One CI
on:
  push:
    branches: [main, codex/vortex-one-completion, codex/vortex-one-finalization]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vortex_one_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vortex_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check server/src/index.js
      - run: node --check server/src/routes/property.js
      - run: node --check server/src/routes/owners.js
      - run: node --check server/src/services/propertyIntelligence.js
      - run: node --check server/src/services/ringcentral.js
      - run: node --check server/src/routes/tasks.js
      - run: node --check server/src/routes/reports.js
      - run: node --check server/src/routes/dataQuality.js
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/vortex_one_test
      - name: Generate ephemeral CI secrets
        run: |
          BETTER_AUTH_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          echo "::add-mask::$JWT_SECRET"
          echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
      - run: |
          npm run test:m1
          npm run test:workflows
          npm run test:smoke
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/vortex_one_test
      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start application for browser QA
        run: |
          DATABASE_URL=postgresql://postgres@127.0.0.1:5432/vortex_one_test npm start > /tmp/vortex-one.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          cat /tmp/vortex-one.log
          exit 1
      - name: Run browser QA
        run: node server/src/tests/browser-smoke.js
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/vortex_one_test
          TEST_BASE_URL: http://127.0.0.1:8080
