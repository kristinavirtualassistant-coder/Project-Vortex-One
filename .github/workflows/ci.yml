name: Vortex One CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: node --check server/src/index.js
      - run: node --check server/src/routes/property.js
      - run: node --check server/src/routes/owners.js
      - run: node --check server/src/services/propertyIntelligence.js
